# Fast feedback on a change. Release packaging is isolated in release.yml so
# ordinary development never waits on it.
#
# This also runs on pushes to main: work here has historically landed straight
# on main, and a gate that only fires on pull requests would never fire at all.

name: PR quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TYPST_VERSION: "0.15.1"
  # CI runners have no usable user namespace for Chrome's sandbox
  PAPERFORGE_CHROME_NO_SANDBOX: "1"

jobs:
  # Everything that needs no browser and no typesetter, so a stale bundle or a
  # dead documentation link is reported in seconds rather than after a build.
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # the unit checks typeset a PDF to prove the cross-edition comparison
      # fires, so this job needs Typst; it needs no CJK fonts
      - uses: ./.github/actions/setup
        with:
          typst-version: ${{ env.TYPST_VERSION }}
          fonts: "false"

      - name: Compile every module
        run: python3 -m compileall -q paperforge

      # Node 22.16.0 is what RealtimeX ships, pinned in .nvmrc. The manifest is
      # a contract with that host, so it is parsed and checked on the host's own
      # runtime rather than on whatever the runner defaults to.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Verify the Node runtime
        run: node scripts/node-runtime-contract.mjs

      - name: Verify the plugin manifest contract
        run: node scripts/check-plugin-manifest.mjs

      # Bundle drift, reference-link integrity and one version across the
      # manifest and the skill. All three have already gone wrong once.
      - name: Plugin bundle, references and version
        run: python3 -m coverage run bin/paperforge plugin --check

      # The hard-link publish path cannot be reached from a fixture: there is no
      # RealtimeX host on a runner. This drives it against a temporary storage
      # root, including the detached-link case that silently serves stale content.
      - name: Publishing unit checks
        run: python3 -m coverage run tests/unit_publish.py

      # manifest resolution and the errors it is documented to raise; no fixture
      # reaches them, because CI always passes --config and never mistypes a type
      - name: Manifest resolution unit checks
        run: python3 -m coverage run tests/unit_cli.py

      # the gates' own rules: a fixture proves the pipeline runs, not that a
      # rule refuses what it claims to refuse
      - name: Gate rule unit checks
        run: python3 -m coverage run tests/unit_gates.py

      - name: Packager unit checks
        run: python3 -m coverage run tests/unit_package.py

      - name: Cross-edition unit checks
        run: python3 -m coverage run tests/unit_editions.py

      # the diagram refusals, with the browser stubbed: what is under test is
      # this pipeline's reading of the output, not Chrome
      - name: Diagram unit checks
        run: python3 -m coverage run tests/unit_diagrams.py

      # the run record: a corpus lost its first draft to a second run that
      # overwrote it in place, and git alone did not prevent that
      - name: Run record unit checks
        run: python3 -m coverage run tests/unit_runs.py

      # the generated authoring brief: it must state what a project declares
      # and refuse to invent the parts that are judgement
      - name: Authoring brief unit checks
        run: python3 -m coverage run tests/unit_brief.py

      # manuscript front matter: parsed, validated, and refusing to guess
      - name: Front matter unit checks
        run: python3 -m coverage run tests/unit_front.py

      # one document from several files: the pieces are concatenated before
      # anything parses them, so references resolve across the whole work
      - name: Assembly unit checks
        run: python3 -m coverage run tests/unit_assemble.py

      # two columns: what has to cross the gutter, and the fact that reading a
      # two-column page a line at a time reads straight across it
      - name: Column unit checks
        run: python3 -m coverage run tests/unit_columns.py

      # the four book conventions and the crop that lets the cross-edition
      # comparison tell a chapter opening from a running head. The book fixture
      # below proves a bound edition builds; this proves it is bound correctly,
      # and it has been running only on developer machines since it was written.
      - name: Book unit checks
        run: python3 -m coverage run tests/unit_book.py

      # one palette across four surfaces. The measured half reads the colours
      # back off a PDF and a .docx, because the shipped defaults and a project's
      # palette look identical in the source and differ only on the page.
      - name: Palette unit checks
        run: python3 -m coverage run tests/unit_palette.py

      # .coverage.* files are hidden; upload-artifact v4 drops those unless told.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-contract
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The real gate. Each fixture is a language, and the whole point of having
  # more than one is that a single language cannot prove the pipeline carries no
  # assumptions - so a failure has to name which language broke.
  documents:
    name: Documents (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: en, project: tests/fixtures/en-sample }
          - { name: zh, project: tests/fixtures/zh-sample }
          - { name: id, project: tests/fixtures/id-sample }
          - { name: bilingual, project: tests/fixtures/bilingual }
          - { name: citations, project: tests/fixtures/citations }
          # the bound edition: recto chapter openings, blank versos,
          # verso/recto running heads and a roman-to-arabic restart,
          # none of which is visible in a document under ten pages
          - { name: book, project: tests/fixtures/book }
          # the only fixture that publishes; target = "directory" needs no host
          - { name: publishing, project: tests/fixtures/publishing }
          # report + brief + deck in two languages: the only deck CI builds
          - { name: backtest, project: tests/backtest }
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      # figures -> lint -> build -> verify -> publish. Nothing in the fixtures is
      # publishable, so publish reports "skipped" and the chain still proves the
      # gate ran.
      - name: Build and verify
        run: python3 -m coverage run bin/paperforge all --config "$PWD/${{ matrix.project }}/documents.toml"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # A fixture that builds nothing would pass every check above. Assert the
      # artifact exists rather than inferring it from a green step.
      - name: Assert an artifact was produced
        run: |
          set -euo pipefail
          found=$(find "${{ matrix.project }}" -name '*.html' | wc -l)
          [ "$found" -gt 0 ] || { echo "::error::no HTML produced for ${{ matrix.name }}"; exit 1; }
          echo "$found document(s) built"

  # The overall quality gate. The fixtures run as parallel jobs, so no single
  # job sees the whole picture; this combines their data and holds line and
  # branch coverage to a floor. Two numbers rather than one, because a combined
  # figure lets branch coverage rot while line coverage carries the average -
  # and the defects here have been branch-shaped.
  coverage:
    name: Quality gate
    needs: [contract, documents, scaffold]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coverage
        run: python3 -m pip install --disable-pip-version-check "coverage==7.15.4" "python-docx==1.1.2"

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and enforce the floors
        run: python3 scripts/check-coverage.py

  # `init` is the first thing a new user runs, and the README states an
  # acceptance criterion for it - "a freshly scaffolded project passes
  # `paperforge all` clean" - that nothing checked. A documented promise no
  # test makes is the kind of claim this repo gates against everywhere else.
  scaffold:
    name: Scaffold acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Scaffold a project in two languages and five publications
        run: |
          python3 -m coverage run bin/paperforge init \
            --into "$RUNNER_TEMP/scaffolded" --slug ci-check \
            --title "Scaffold acceptance check" --languages en,vi \
            --publications report,book,annex,brief,deck \
            --organisation "Paperforge" --publisher "Paperforge Research" --no-git

      - name: A fresh project must pass the whole chain clean
        run: python3 -m coverage run bin/paperforge all --config "$RUNNER_TEMP/scaffolded/documents.toml"

      # One file under both names: Claude Code reads CLAUDE.md and nothing else,
      # every other agent reads AGENTS.md. The link is relative, so the project
      # stays movable, and git records it as a link (mode 120000) rather than as
      # a file holding the path.
      - name: The agent files are written, and CLAUDE.md links to AGENTS.md
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/scaffolded"
          test -f AGENTS.md
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = "AGENTS.md"
          # reading through the link reaches the real file, not a path
          grep -q 'consumer' CLAUDE.md
          git init -q . && git add -A
          test "$(git ls-files -s CLAUDE.md | cut -d" " -f1)" = "120000"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-scaffold
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
