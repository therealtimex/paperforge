# Gated plugin packaging and publication. Never runs for pull requests.
#
# The gates are re-run here rather than trusted from the pull request: a tag can
# be cut from any commit, and the artifact this publishes is what people install.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release part-way through packaging or publication.
  cancel-in-progress: false

env:
  TYPST_VERSION: "0.15.1"
  PAPERFORGE_CHROME_NO_SANDBOX: "1"

jobs:
  # Refuse early and cheaply if the tag does not name the version being shipped.
  # The manifest and the skill frontmatter had already drifted apart before
  # anything was released; a tag is the third place the same fact is written.
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - id: plan
        name: Assert the tag matches the plugin version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            bin/paperforge plugin --check --tag "${{ github.ref_name }}"
          else
            bin/paperforge plugin --check
          fi
          version=$(python3 -c "import json;print(json.load(open('plugin/realtimex.plugin.json'))['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing ${version}"

  contract:
    name: Contract
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # the unit checks typeset a PDF to prove the cross-edition comparison
      # fires, so this job needs Typst; it needs no CJK fonts
      - uses: ./.github/actions/setup
        with:
          typst-version: ${{ env.TYPST_VERSION }}
          fonts: "false"

      - name: Compile every module
        run: python3 -m compileall -q paperforge

      # Node 22.16.0 is what RealtimeX ships, pinned in .nvmrc. The manifest is
      # a contract with that host, so it is parsed and checked on the host's own
      # runtime rather than on whatever the runner defaults to.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Verify the Node runtime
        run: node scripts/node-runtime-contract.mjs

      - name: Verify the plugin manifest contract
        run: node scripts/check-plugin-manifest.mjs

      - name: Plugin bundle, references and version
        run: python3 -m coverage run bin/paperforge plugin --check

      # The hard-link publish path cannot be reached from a fixture: there is no
      # RealtimeX host on a runner. This drives it against a temporary storage
      # root, including the detached-link case that silently serves stale content.
      - name: Publishing unit checks
        run: python3 -m coverage run tests/unit_publish.py

      # manifest resolution and the errors it is documented to raise; no fixture
      # reaches them, because CI always passes --config and never mistypes a type
      - name: Manifest resolution unit checks
        run: python3 -m coverage run tests/unit_cli.py

      # the gates' own rules: a fixture proves the pipeline runs, not that a
      # rule refuses what it claims to refuse
      - name: Gate rule unit checks
        run: python3 -m coverage run tests/unit_gates.py

      - name: Packager unit checks
        run: python3 -m coverage run tests/unit_package.py

      - name: Cross-edition unit checks
        run: python3 -m coverage run tests/unit_editions.py

      # the diagram refusals, with the browser stubbed: what is under test is
      # this pipeline's reading of the output, not Chrome
      - name: Diagram unit checks
        run: python3 -m coverage run tests/unit_diagrams.py

      # .coverage.* files are hidden; upload-artifact v4 drops those unless told.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-contract
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  documents:
    name: Documents (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: en, project: tests/fixtures/en-sample }
          - { name: zh, project: tests/fixtures/zh-sample }
          - { name: id, project: tests/fixtures/id-sample }
          - { name: bilingual, project: tests/fixtures/bilingual }
          - { name: citations, project: tests/fixtures/citations }
          # the only fixture that publishes; target = "directory" needs no host
          - { name: publishing, project: tests/fixtures/publishing }
          # report + brief + deck in two languages: the only deck CI builds
          - { name: backtest, project: tests/backtest }
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Build and verify
        run: python3 -m coverage run bin/paperforge all --config "$PWD/${{ matrix.project }}/documents.toml"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  package:
    name: Plugin bundle
    needs: [plan, contract, documents]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      # Refuses on a stale bundle, a dead reference link or a version mismatch,
      # so the zip cannot be built from a tree that would fail the gate.
      # workflow_dispatch runs this whole pipeline as a rehearsal from a branch,
      # where there is no tag to match; only a tag run asserts the name.
      - name: Package
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            bin/paperforge plugin --package dist --tag "${{ github.ref_name }}"
          else
            bin/paperforge plugin --package dist
          fi

      # Unpack the zip the way a user would and build a document *from the
      # unpacked copy*. A zip that unpacks is not a plugin that works: the
      # bundle carries its own pipeline and its own fixture, and either could be
      # incomplete in a way that only running them reveals.
      - name: Smoke-test the packaged bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/installed && mkdir -p /tmp/installed
          unzip -q "dist/paperforge-plugin-${{ needs.plan.outputs.version }}.zip" -d /tmp/installed
          test -f /tmp/installed/realtimex.plugin.json
          test -f /tmp/installed/skills/paperforge/SKILL.md
          cd /tmp/installed && skills/paperforge/pipeline/bin/paperforge selftest

      - uses: actions/upload-artifact@v4
        with:
          name: paperforge-plugin-${{ needs.plan.outputs.version }}
          path: dist/paperforge-plugin-*.zip
          # a missing artifact is a failure, not silence
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [plan, contract, documents, coverage, package]
    # always() lets this job evaluate the results explicitly. Without it a
    # skipped gate is indistinguishable from a passed one.
    if: >-
      always() &&
      github.ref_type == 'tag' &&
      needs.contract.result == 'success' &&
      needs.documents.result == 'success' &&
      needs.coverage.result == 'success' &&
      needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paperforge-plugin-${{ needs.plan.outputs.version }}
          path: dist

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist && sha256sum paperforge-plugin-*.zip | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/paperforge-plugin-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

  # The overall quality gate. The fixtures run as parallel jobs, so no single
  # job sees the whole picture; this combines their data and holds line and
  # branch coverage to a floor. Two numbers rather than one, because a combined
  # figure lets branch coverage rot while line coverage carries the average -
  # and the defects here have been branch-shaped.
  coverage:
    name: Quality gate
    needs: [contract, documents, scaffold]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coverage
        run: python3 -m pip install --disable-pip-version-check "coverage==7.15.4"

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and enforce the floors
        run: python3 scripts/check-coverage.py

  # `init` is the first thing a new user runs, and the README states an
  # acceptance criterion for it - "a freshly scaffolded project passes
  # `paperforge all` clean" - that nothing checked. A documented promise no
  # test makes is the kind of claim this repo gates against everywhere else.
  scaffold:
    name: Scaffold acceptance
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - name: Scaffold a project in two languages and four publications
        run: |
          python3 -m coverage run bin/paperforge init \
            --into "$RUNNER_TEMP/scaffolded" --slug ci-check \
            --title "Scaffold acceptance check" --languages en,vi \
            --publications report,annex,brief,deck \
            --organisation "Paperforge" --publisher "Paperforge Research" --no-git

      - name: A fresh project must pass the whole chain clean
        run: python3 -m coverage run bin/paperforge all --config "$RUNNER_TEMP/scaffolded/documents.toml"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-scaffold
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
