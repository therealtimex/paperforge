# English research-document conventions.
lang = "en"
script = "latin"
direction = "ltr"
fold_diacritics = true

[fonts]
serif = 'Georgia,"Noto Serif","Times New Roman",Times,serif'
sans  = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif'


[labels]
references      = "References"
figure          = "Figure %d"
annex_figure    = "Figure A%d"
table           = "Table %d"
equation        = "Equation %d"
annex_table     = "Table A%d"
annex_equation  = "Equation A%d"
abstract        = "Abstract"
keywords        = "Keywords"
corresponding   = "Corresponding author"
funding         = "Funding"
conflicts       = "Conflicts of interest"
ethics          = "Ethics"
declarations    = "Declarations"
anonymised      = "Author details removed for blind review."
annex_badge     = "Annex"
annex_divider   = "ANNEX"
annex_entry     = "Annex"
short_document  = "Short document"
document        = "DOCUMENT"
deck            = "PRESENTATION"

[ui]
contents_button = "Contents"
print_button    = "Print / Save PDF"
nav_title       = "Contents"
scroll_hint     = "Swipe sideways to see the full table"
footer_note     = "Circulated for policy research and planning purposes."

[structure]
contents_heading = "CONTENTS"
part_banner      = "^(PART|CONCLUSION|CONTENTS|\\d+\\.\\s*EXECUTIVE)"
part_word        = "part"
section_word     = "section"
annex_word       = "annex"
annex_anchor     = "annex"
annex_reference  = "Annex Section"

[scaffold]
date_format = "%B %Y"
prepared_by = "Prepared by"
completed   = "Completed"
summary     = "Executive summary"
section_one = "Context"
section_two = "Findings"
conclusion  = "Conclusion"
sources     = "Sources and method"
prose       = "Replace this paragraph with the substance of the section."

[provenance]
# What a project inherits by naming this profile, and what it does not
# claim. A default that says nothing about itself is one nobody can
# tell apart from a considered decision - see AGENTS.md, "The defaults
# agreed, which is why nothing looked wrong".
what     = "Label and structure conventions for English research documents"
not      = "Not a publisher's template and not any journal's requirements"
basis    = "Written alongside the en-sample fixture, whose stated purpose is to show the pipeline carries no Vietnamese assumptions. Built end to end on every run, printed page numbers included."
reviewed = "2026-08-28"
